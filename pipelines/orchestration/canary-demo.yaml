apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: gold-api-demo
  namespace: spark-jobs
spec:
  replicas: 4
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: { duration: 30s }
        - setWeight: 50
        - pause: { duration: 30s }
        - setWeight: 100
  selector:
    matchLabels:
      app: gold-api-demo
  template:
    metadata:
      labels:
        app: gold-api-demo
    spec:
      containers:
        - name: gold-api-demo
          image: hashicorp/http-echo:latest
          args:
            - "-text=version-1"
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: gold-api-demo
  namespace: spark-jobs
spec:
  selector:
    app: gold-api-demo
  ports:
    - port: 80
      targetPort: 5678