apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: gold-yellow-marts
  namespace: spark-jobs
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: 221185654241.dkr.ecr.us-east-1.amazonaws.com/tlc-gold-transform:latest
  imagePullPolicy: Always
  mainApplicationFile: local:///opt/spark/work-dir/build_marts.py
  arguments:
    - "s3a://kinush02-tlc-platform-silver/yellow-k8s/2025-03"
    - "s3a://kinush02-tlc-platform-bronze/reference/taxi_zone_lookup.csv"
    - "s3a://kinush02-tlc-platform-gold/yellow-k8s/2025-03"
  sparkVersion: "3.4.0"
  driver:
    cores: 1
    memory: "512m"
    serviceAccount: spark-jobs-sa
  executor:
    cores: 1
    memory: "512m"
    instances: 1
    serviceAccount: spark-jobs-sa